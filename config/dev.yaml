# --------------------------------------------------------------------
  # WEkEO DATASETS (Copernicus Land Monitoring Service)
  # --------------------------------------------------------------------
  wekeo:
    enabled: false
    dataset_resolution: "250m" # Fetches the finest raw data before upscaling/downscaling
    catalog_path: 
    # ------------------------------------------------------------------
    # GLOBAL DEFAULTS for WEkEO
    # If a dataset below doesn't specify an override, it inherits these.
    # ------------------------------------------------------------------
    defaults:
      continuous_aggregations: 
        - "average"
        - "max"
        - "min"
        - "rms"
      discrete_classes: "all" # Instructs the engine to fetch every available class

    # ------------------------------------------------------------------
    # DATA INVENTORY (Grouped by GeoParquet 'collection' Keys)
    # ------------------------------------------------------------------
    categories:
      # --- Tree Cover & Forest (TCF) ---
      TCF:
        include: true
        datasets:
          Tree_Cover_Density:
            include: true
            type: "continuous"
          
          Forest_Type:
            include: true
            type: "discrete"
            # OVERRIDE: We only want specific classes
            classes:
              - "Broadleaved_forest"
              - "Coniferous_forest"
              
          Dominant_Leaf_Type:
            include: false
            type: "discrete"
            
          Broadleaved_Cover_Density:
            include: false
            type: "continuous"
            
          Coniferous_Cover_Density:
            include: false
            type: "continuous"
            
          Forest_Additional_Support_Layer:
            include: false
            type: "discrete"
            
          # Confidence Layers
          Tree_Cover_Density_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Dominant_Leaf_Type_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]

      # --- Grassland (GRA) ---
      GRA:
        include: true
        datasets:
          Grassland:
            include: true
            type: "discrete"
            
          Herbaceous_Cover:
            include: false
            type: "continuous"
            
          Ploughing_Indicator:
            include: false
            type: "discrete"
            
          Grassland_Mowing_Events:
            include: false
            type: "discrete"
            
          Grassland_Mowing_Dates:
            include: false
            type: "discrete"
            
          # Confidence Layers
          Grassland_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Grassland_Mowing_Events_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]

      # --- Imperviousness (IMP) ---
      IMP:
        include: false
        datasets:
          Imperviousness_Density:
            include: true
            type: "continuous"
            
          Impervious_Built_up:
            include: false
            type: "discrete"
            
          Share_of_Built_up:
            include: false
            type: "continuous"
            
          # Confidence Layers
          Confidence_layer_for_Imperviousness_Density:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Confidence_layer_for_Impervious_Built_up:
            include: false
            type: "continuous"
            aggregations: ["average"]

      # --- Small Woody Features (SLF) ---
      SLF:
        include: false
        datasets:
          Small_Woody_Features:
            include: true
            type: "discrete"
            
          Woody_Vegetation_Layer:
            include: false
            type: "discrete"
            
          Forest_Mask:
            include: false
            type: "discrete"
            
          Crop_Mask:
            include: false
            type: "discrete"

      # --- Cropland (CRL) ---
      CRL:
        include: false
        datasets:
          Crop_Types:
            include: true
            type: "discrete"
            
          Cropping_Seasons_Yearly:
            include: false
            type: "discrete"
            
          Fallow_Land_Presence:
            include: false
            type: "discrete"
            
          Bare_Soil_Before:
            include: false
            type: "discrete"
            
          Bare_Soil_After:
            include: false
            type: "discrete"
            
          Main_Crop_Emergence:
            include: false
            type: "discrete"
            
          Main_Crop_Harvest:
            include: false
            type: "discrete"
            
          Main_Crop_Duration:
            include: false
            type: "continuous"
            
          Secondary_Crops_Type:
            include: false
            type: "discrete"
            
          Secondary_Crops_Emergence:
            include: false
            type: "discrete"
            
          Secondary_Crops_Duration:
            include: false
            type: "continuous"
            
          # Confidence Layers
          Crop_Types_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Fallow_Land_Presence_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Bare_Soil_Before_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Bare_Soil_After_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Main_Crop_Emergence_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Main_Crop_Harvest_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Main_Crop_Duration_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]
            
          Secondary_Crops_Duration_Confidence_Layer:
            include: false
            type: "continuous"
            aggregations: ["average"]

      # --- CORINE Land Cover ---
      CORINE:
        include: false
        datasets:
          Corine_Land_Cover_2018:
            include: true
            type: "discrete"
            
          Corine_Land_Cover_2012:
            include: false
            type: "discrete"
            
          Corine_Land_Cover_2006:
            include: false
            type: "discrete"
            
          Corine_Land_Cover_2000:
            include: false
            type: "discrete"
            
          Corine_Land_Cover_1990:
            include: false
            type: "discrete"