    lat_min: 50.583876
    lat_max: 51.386124
temporal:
  start_year: 2018
  start_month: 1
  end_year: 2018
  end_month: 12
sources:
  chelsa:
    enabled: true
    catalog_path: C:\Users\niels\Documents\Repositories\BmC\meta\chelsa_gp_stac\chelsa_master.parquet
