base_dir: ../test_cubes/
cube_name: gbif_test_04_eea_polygon_fractional
spatial:
  target_grid: EEA
  target_resolution: 1km
  use_bbox: true
  bbox:
    long_min: 2.591733
    long_max: 5.883999
    lat_min: 50.680797
    lat_max: 51.9639
temporal:
  start_year: 2004
  start_month: 1
  end_year: 2025
  end_month: 12
sources:
  gbif:
    query_filters:
      taxon_keys:
      - G59D
      - 4F6YZ
      - 3Y9W2
      - 5B9T3
      - 4HPXM
      record_type: presence
      default_Uncertainty: 1000
      max_uncertainty: 1000
      exclude_issues:
      - ZERO_COORDINATE
      - COORDINATE_OUT_OF_RANGE
      - COUNTRY_COORDINATE_MISMATCH
    taxonomy:
      col_backbone: true
    columns:
    - year
    - month
    - recordedby
    time_cols:
    - year
    - month
    processing_mode: vector
    vector_processing:
      topology: polygon
      mapping_mode: fractional
      spatial_method: intersect
      topology_config:
        polygon:
          quad_segs: 8
    aggregate:
      export_unaggregated: true
      group_by_columns:
      - specieskey
      - year
      - month
      metrics:
      - column: areal_fraction
        method: sum
        weighted: false
        rename: expected_occurrences
