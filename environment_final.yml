name: bmc_test
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Base Python Runtime
  - python=3.12

  # Core Spatial & C++ Backed Engines 
  # (Relaxed to allow Conda to resolve GEOS/PROJ C++ trees)
  - gdal>=3.6.2
  - rasterio>=1.4.0
  - geopandas>=1.1.0
  - shapely>=2.1.0
  - pyproj>=3.6.0

  # Data Science & Arrays
  - numpy>=2.0.0
  - pandas>=2.2.0
  - sparse>=0.15.0

  # Advanced Spatial Analytics & Big Data
  - python-duckdb>=1.0.0
  - dask-geopandas
  - pot
  - libpysal
  - esda

  # Web Services & STAC Metadata APIs
  - requests
  - hda
  - pystac

  # Utilities
  - pyyaml
  - psutil

  # Pip-managed Packages & Backend Storage Drivers
  - pip
  - pip:
      - scipy>=1.14.0
      - xarray>=2025.1.0
      - rioxarray>=0.22.0
      - dask>=2025.1.0
      - pygbif>=0.6.6
      - netcdf4>=1.7.0 
      - zarr>=2.18.0