base_dir: ./tech_demo_output/
cube_name: techDemo_cube

export_as:
  format: netcdf

spatial:
  target_grid: EEA
  target_resolution: 1km
  use_bbox: true
  bbox:
      long_min: 2.3413303628097433
      long_max: 6.038920099374836
      lat_min: 50.475604768288925
      lat_max: 52.16588307249603

temporal:
  start_year: 2004
  start_month: 1
  end_year: 2025
  end_month: 12

sources:
  chelsa:
    enabled: true
    levels:
      monthly:
        include: true
        variables:
          pr: true
          tas: true
      bioclim:
        include: true
        time_ranges:
          "1981-2010": true
          "2011-2040": true
          "2041-2070": true
        ensembles:
          historical: true
          GFDL-ESM4: true
          MPI-ESM1-2-HR: true
        scenarios:
          historical: true
          ssp126: true
          ssp585: true
        variables:
          bio01: true  # Mean Annual Temp
          bio12: true  # Annual Precipitation

  gbif:
    enabled: true
    # Pointing directly to the bypassed local zip download
    local_file_path: "gbif_data/0013304-260721160103020.zip" 
    query_filters:
      taxon_keys: ['4HPXM', '5B9T3', 'G59D', '4F6YZ', '3Y9W2'] 
      record_type: presence
      default_Uncertainty: 1000
      max_uncertainty: 1000
      exclude_issues:
        - ZERO_COORDINATE
        - COORDINATE_OUT_OF_RANGE
        - COUNTRY_COORDINATE_MISMATCH
    taxonomy:
      col_backbone: true
    columns: ["year", "month", "recordedby"]
    time_cols: ["year", "month"]
    processing_mode: "vector"
    vector_processing:
      topology: "point_cloud"
      mapping_mode: "classify"
      spatial_method: "intersect"
      topology_config:
        point_cloud:
          n_passes: 100 
          distribution: "gaussian"
          random_seed: 42
    aggregate:
      export_unaggregated: false
      group_by_columns: ["specieskey", "year", "month"]
      metrics:
        - column: "gbifid"
          method: "nunique"
          weighted: false
          rename: "observation_count"